<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Đặt mật khẩu mới | Xây Dựng Kết Nối</title>
	<style>
		:root { --ink:#172536; --muted:#667283; --line:#dce3e8; --paper:#f4f7f7; --white:#fff; --teal:#147d78; --danger:#b42318; }
		* { box-sizing:border-box; }
		body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; color:var(--ink); background:linear-gradient(135deg,#eef5f4,#f9f7f2); font:16px/1.5 "Segoe UI",sans-serif; }
		main { width:min(480px,100%); padding:28px; background:var(--white); border:1px solid var(--line); }
		a { color:var(--teal); font-weight:700; text-decoration:none; }
		h1 { margin-top:0; font-size:28px; }
		p { color:var(--muted); }
		label { display:block; margin:18px 0 6px; font-weight:700; }
		input,button { width:100%; padding:12px; font:inherit; }
		input { border:1px solid #b8c4ca; }
		button { margin-top:18px; color:#fff; background:var(--teal); border:0; font-weight:700; cursor:pointer; }
		button:disabled { opacity:.55; }
		#message.error { color:var(--danger); }
	</style>
</head>
<body>
	<main>
		<a href="dangnhap.html">Quay lại đăng nhập</a>
		<h1>Đặt mật khẩu mới</h1>
		<p>Mã SMS có hiệu lực trong 10 phút. Bạn có tối đa 5 lần nhập mã.</p>
		<form id="resetForm">
			<label for="phone">Số điện thoại</label>
			<input id="phone" type="tel" inputmode="numeric" autocomplete="tel" required />
			<label for="code">Mã xác nhận 6 số</label>
			<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required />
			<label for="password">Mật khẩu mới</label>
			<input id="password" type="password" autocomplete="new-password" minlength="8" required />
			<label for="confirmPassword">Nhập lại mật khẩu mới</label>
			<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
			<button type="submit">Đổi mật khẩu</button>
			<p id="message" role="status" aria-live="polite"></p>
		</form>
	</main>
	<script src="js/api.js"></script>
	<script>
		const form = document.getElementById('resetForm');
		const message = document.getElementById('message');
		document.getElementById('phone').value = sessionStorage.getItem('xdkn_reset_phone') || '';
		form.addEventListener('submit', async (event) => {
			event.preventDefault();
			const password = document.getElementById('password').value;
			const button = form.querySelector('button');
			if (password !== document.getElementById('confirmPassword').value) {
				message.textContent = 'Mật khẩu nhập lại không khớp.';
				message.className = 'error';
				return;
			}
			button.disabled = true;
			message.textContent = 'Đang đổi mật khẩu...';
			message.className = '';
			try {
				const result = await API.post('/auth/reset-password', {
					phone: document.getElementById('phone').value.trim(),
					code: document.getElementById('code').value.trim(),
					password
				});
				sessionStorage.removeItem('xdkn_reset_phone');
				message.textContent = result.message;
				location.href = 'dangnhap.html';
			} catch (error) {
				message.textContent = error.message;
				message.className = 'error';
				button.disabled = false;
			}
		});
	</script>
</body>
</html>
